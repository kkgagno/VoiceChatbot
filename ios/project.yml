name: VoiceChatbot
options:
  bundleIdPrefix: com.keithgagnon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  VoiceChatbot:
    type: application
    platform: iOS
    sources:
      - path: VoiceChatbot
    info:
      path: VoiceChatbot/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithgagnon.VoiceChatbot
        PRODUCT_NAME: VoiceChatbot
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
