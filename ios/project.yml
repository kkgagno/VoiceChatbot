name: VoiceChatbot
options:
  bundleIdPrefix: com.keithgagnon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  Porcupine:
    url: https://github.com/Picovoice/porcupine.git
    exactVersion: "4.0.0"
targets:
  VoiceChatbot:
    type: application
    platform: iOS
    sources:
      - path: VoiceChatbot
    dependencies:
      - package: Porcupine
        product: Porcupine
    info:
      path: VoiceChatbot/Info.plist
      properties:
        CFBundleDisplayName: Voice Chatbot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: Voice Chatbot uses the microphone during conversations and transcription sessions you start.
        NSCameraUsageDescription: Voice Chatbot uses the camera only when you choose to take a photo for your PC model to examine.
        NSPhotoLibraryAddUsageDescription: Voice Chatbot adds generated images to Photos only when you tap Save to Photos.
        NSLocalNetworkUsageDescription: Voice Chatbot connects to your VoiceChatbot server on your PC over Wi-Fi or VPN.
        NSCalendarsFullAccessUsageDescription: Voice Chatbot uses calendar access to show upcoming events and add events only after you confirm them.
        NSContactsUsageDescription: Voice Chatbot uses contacts to resolve names and prepare text messages only after you request them.
        NSHealthShareUsageDescription: Voice Chatbot reads only the Apple Health categories you choose so it can answer your health and activity questions.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            minilagertha.tail2762b8.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithgagnon.VoiceChatbot
        PRODUCT_NAME: VoiceChatbot
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: VoiceChatbot/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: VoiceChatbot/VoiceChatbot.entitlements
    scheme:
      testTargets: []
