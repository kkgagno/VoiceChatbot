name: VoiceChatbot
options:
  bundleIdPrefix: com.keithgagnon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  VoiceChatbot:
    type: application
    platform: iOS
    sources:
      - path: VoiceChatbot
    info:
      path: VoiceChatbot/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithgagnon.VoiceChatbot
        PRODUCT_NAME: VoiceChatbot
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: VoiceChatbot/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Voice Chatbot uses the microphone during conversations and transcription sessions you start.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Voice Chatbot connects to your VoiceChatbot server on your PC over Wi-Fi or VPN.
        INFOPLIST_KEY_UIBackgroundModes: audio
    scheme:
      testTargets: []
