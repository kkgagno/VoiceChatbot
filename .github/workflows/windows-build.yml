name: Build Windows client

on:
  push:
    branches:
      - codex/ios-native-client
    paths:
      - "**/*.cs"
      - "VoiceChatbot.csproj"
      - "Resources/Models/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "**/*.cs"
      - "VoiceChatbot.csproj"
      - "Resources/Models/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - name: Build
        shell: pwsh
        run: |
          dotnet build --configuration Release --no-restore 2>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Publish compiler errors
        if: failure()
        shell: pwsh
        run: |
          $pattern = '^(.*)\((\d+),(\d+)\): error ([^:]+): (.*)$'
          Get-Content build.log | ForEach-Object {
            if ($_ -match $pattern) {
              $path = $matches[1].Replace('\', '/')
              $message = "$($matches[4]): $($matches[5])"
              Write-Output "::error file=$path,line=$($matches[2]),col=$($matches[3])::$message"
            } elseif ($_ -match '(?i)\berror\b') {
              $message = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error file=.github/workflows/windows-build.yml,line=1::$message"
            }
          }

      - name: Create portable test build
        run: >
          dotnet publish --configuration Release --runtime win-x64
          --self-contained true
          --output artifacts/VoiceChatbot-VAD-Test

      - name: Run Silero model
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "artifacts/VoiceChatbot-VAD-Test/VoiceChatbot.exe" `
            -ArgumentList "--vad-self-test" `
            -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Silero VAD runtime self-test failed with exit code $($process.ExitCode)."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceChatbot-VAD-Test-win-x64
          path: artifacts/VoiceChatbot-VAD-Test
          retention-days: 14
