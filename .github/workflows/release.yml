name: Build Windows release (Mini)

# Voice Chatbot Mini is released from the mini branch with its own tags (mini-v1.2.3), so its
# releases never mix with the full app's v1.2.3 tags and releases.
on:
  workflow_dispatch:
  push:
    tags:
      - "mini-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Determine version
        id: version
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}" -replace '^mini-v', ''
          } else {
            "1.0.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable archive
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\Build-Installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChatbotMini-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Voice Chatbot Mini ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
