name: Build iPhone client

on:
  push:
    branches:
      - codex/ios-native-client
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceChatbot.xcodeproj \
            -scheme VoiceChatbot \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Publish compiler errors
        if: failure()
        working-directory: ios
        run: |
          python3 - <<'PY'
          import os
          import re

          workspace = os.environ["GITHUB_WORKSPACE"] + os.sep
          pattern = re.compile(r"^(.*?\.swift):(\d+):(\d+): (error|warning): (.*)$")

          with open("xcodebuild.log", encoding="utf-8", errors="replace") as log:
              for raw_line in log:
                  match = pattern.match(raw_line.strip())
                  if not match:
                      continue
                  path, line, column, level, message = match.groups()
                  if path.startswith(workspace):
                      path = path[len(workspace):]
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::{level} file={path},line={line},col={column}::{message}")
          PY

      - name: Verify runtime privacy configuration
        working-directory: ios
        run: |
          APP_PATH="$PWD/build/Build/Products/Debug-iphonesimulator/VoiceChatbot.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP_PATH/Info.plist" | grep -Fx audio
