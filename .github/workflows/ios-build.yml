name: Build iPhone client

on:
  push:
    branches:
      - codex/ios-native-client
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceChatbot.xcodeproj \
            -scheme VoiceChatbot \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Publish compiler errors
        if: failure()
        working-directory: ios
        run: |
          python3 - <<'PY'
          import os
          import re

          workspace = os.environ["GITHUB_WORKSPACE"] + os.sep
          pattern = re.compile(r"^(.*?\.swift):(\d+):(\d+): (error|warning): (.*)$")

          with open("xcodebuild.log", encoding="utf-8", errors="replace") as log:
              found = False
              for raw_line in log:
                  line_text = raw_line.strip()
                  match = pattern.match(line_text)
                  if not match:
                      if " error:" in line_text.lower() or line_text.lower().startswith("error:"):
                          message = line_text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error::{message}")
                          found = True
                      continue
                  path, line, column, level, message = match.groups()
                  if path.startswith(workspace):
                      path = path[len(workspace):]
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::{level} file={path},line={line},col={column}::{message}")
                  found = True
              if not found:
                  print("::error::Xcode build failed; inspect the Build for iPhone Simulator step.")
          PY

      - name: Verify runtime privacy configuration
        working-directory: ios
        run: |
          APP_PATH="$PWD/build/Build/Products/Debug-iphonesimulator/VoiceChatbot.app"
          test -d "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          plutil -p "$PLIST"

          verify_key() {
            local key="$1"
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST"; then
              echo "::error file=ios/VoiceChatbot/Info.plist::Compiled app is missing $key"
              exit 1
            fi
          }

          verify_key "NSMicrophoneUsageDescription"
          verify_key "NSCameraUsageDescription"
          verify_key "NSPhotoLibraryAddUsageDescription"
          verify_key "NSLocalNetworkUsageDescription"
          verify_key "UIBackgroundModes"
