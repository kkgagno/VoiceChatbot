name: CI

on:
  push:
    branches: [main, mini]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build app
        run: dotnet build VoiceChatbot.csproj -c Release

      - name: Run unit tests
        run: dotnet test tests/VoiceChatbot.Tests/VoiceChatbot.Tests.csproj -c Release
